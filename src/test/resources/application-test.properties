spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
# the row above takes the template from the Entity User
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# if you are running the project for the first time and the UserRepositoryTest fails change this line:
# spring.jpa.hibernate.ddl-auto=update
# to this:
# spring.jpa.hibernate.ddl-auto=create
# and after the first run change it back to update